<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" font-family="Monaco,'Courier New',Consolas,monospace" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5A52"/></marker></defs><text x="320" y="26" text-anchor="middle" fill="#4B5A52" font-size="11">cửa sổ ngữ cảnh (context window), theo đúng thứ tự</text><rect x="30" y="42" width="165" height="52" rx="7" fill="#F7F9F6" stroke="#1F6B52" stroke-width="1.5"/><text x="112.5" y="72.5" text-anchor="middle" fill="#4B5A52">system prompt</text><text x="112" y="112" text-anchor="middle" fill="#7C8A82" font-size="11">cố định từng byte</text><rect x="200" y="42" width="115" height="52" rx="7" fill="#F7F9F6" stroke="#1F6B52" stroke-width="1.5"/><text x="257.5" y="72.5" text-anchor="middle" fill="#4B5A52">tools</text><text x="257" y="112" text-anchor="middle" fill="#7C8A82" font-size="11">tập công cụ cố định</text><rect x="320" y="42" width="190" height="52" rx="7" fill="#F7F9F6" stroke="#D2DACF" stroke-width="1.5"/><text x="415.0" y="72.5" text-anchor="middle" fill="#4B5A52">history</text><text x="415" y="112" text-anchor="middle" fill="#7C8A82" font-size="11">dài thêm, tự nén lại</text><rect x="515" y="42" width="95" height="52" rx="7" fill="#F7F9F6" stroke="#8A6B23" stroke-width="1.5"/><text x="562.5" y="72.5" text-anchor="middle" fill="#8A6B23">mục tiêu</text><text x="562" y="112" text-anchor="middle" fill="#7C8A82" font-size="11">phần đuôi (tail)</text><rect x="235" y="145" width="170" height="46" rx="7" fill="#F7F9F6" stroke="#D2DACF" stroke-width="1.5"/><text x="320.0" y="172.5" text-anchor="middle" fill="#4B5A52">ổ đĩa / tệp tin</text><line x1="405" y1="168" x2="450" y2="168" stroke="#4B5A52" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="458" y="172" text-anchor="start" fill="#7C8A82" font-size="11">chỉ đưa đường dẫn vào</text></svg>